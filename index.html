<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ระบบทำสัญญาผ่อนชำระ iPhone (MDM)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100dvh;
            overflow: hidden;
            background-color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        iframe {
            width: 100%;
            height: 100dvh;
            border: none;
            display: block;
        }
        /* Loading Screen */
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100dvh;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }
        #loading.fade-out {
            opacity: 0;
            visibility: hidden;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #2563eb; /* โทนสีน้ำเงิน สามารถปรับเปลี่ยนได้ */
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 12px;
        }
        .loading-text {
            color: #334155;
            font-size: 14px;
            font-weight: 500;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div id="loading">
        <div class="spinner"></div>
        <div class="loading-text">กำลังโหลดระบบทำสัญญาผ่อนชำระ iPhone (MDM)...</div>
    </div>

    <iframe 
        id="appFrame" 
        src="https://script.google.com/macros/s/AKfycbwd83k-XBNsTAPR0gndvwCLERHu7tFyjTXnIOwttD91JhMCJpKRuRsJEsEAl2mvm6OP/exec?v=1" 
        allow="fullscreen; camera; microphone; geolocation" 
        onload="hideLoading()">
    </iframe>

    <script>
        function hideLoading() {
            const loading = document.getElementById('loading');
            loading.classList.add('fade-out');
        }
    </script>

</body>
</html>
